<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Positioning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body id="top">

  <nav class="navbar">
    <h1>My Website</h1>
    <ul>
      <li><a href="#cards">Cards</a></li>
      <li><a href="#more">More</a></li>
    </ul>
  </nav>

  <main>
    <section id="cards">
      <h2>Cards</h2>

      <article class="card">
        <span class="badge">3</span>
        <h3>Notifications</h3>
        <p>You have 3 new messages.</p>
      </article>

      <article class="card">
        <span class="badge">1</span>
        <h3>Updates</h3>
        <p>One new update is available.</p>
      </article>
    </section>

    <section id="more" class="tall">
      <h2>More Content</h2>
      <p>Scroll down and up. The navigation bar and the back-to-top button stay in place.</p>
    </section>
  </main>

  <a href="#top" class="back-to-top">Back to top</a>

</body>
</html>
