<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Colors and Opacity</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Colors and Opacity</h1>

  <h2>Color Swatches</h2>
  <div class="palette">
    <div class="swatch named">Named: tomato</div>
    <div class="swatch hex">HEX: #2e86de</div>
    <div class="swatch rgb">RGB: rgb(46, 204, 113)</div>
    <div class="swatch rgba">RGBA: rgba(155, 89, 182, 0.5)</div>
  </div>

  <h2>Opacity vs RGBA</h2>
  <div class="compare">
    <div class="box opacity-box">
      <p>opacity: 0.5<br>The text fades too.</p>
    </div>
    <div class="box rgba-box">
      <p>rgba(..., 0.5)<br>Only the background fades.</p>
    </div>
  </div>

</body>
</html>
